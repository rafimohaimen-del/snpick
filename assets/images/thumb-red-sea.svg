<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-hero" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 0, 0, 0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3ED" />
      <stop offset="100%" stop-color="#ECE8DF" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-hero)" rx="16" />
  <rect width="800" height="450" fill="url(#grid-pattern-hero)" rx="16" />
  <!-- Shipping Route Abstract Lines -->
  <path d="M 120 320 Q 320 220 540 280 T 720 180" fill="none" stroke="rgba(241, 90, 36, 0.25)" stroke-width="3" stroke-dasharray="6 6" />
  <!-- Editorial Orange Geometric Accent -->
  <circle cx="700" cy="380" r="140" fill="#F15A24" />
</svg>
